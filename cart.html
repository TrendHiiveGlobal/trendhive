<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | TrendHive Global Enterprises</title>
  <meta name="description" content="Review items in your cart, apply coupon codes, and see shipping and tax before checkout.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">

  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/shop.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div data-include="header"></div>

  <main id="main-content">
    <div class="shop-header">
      <div class="container">
        <nav class="breadcrumbs"><a href="index.html">Home</a> / <span>Cart</span></nav>
        <h1>Your Cart</h1>
      </div>
    </div>

    <div class="container cart-layout">
      <div>
        <div class="cart-items" id="cart-items"></div>
        <div class="empty-state" id="cart-empty-state" style="display:none;">
          <h3>Your cart is empty</h3>
          <p>Looks like you haven't added anything yet.</p>
          <a href="shop.html" class="btn btn-primary" style="margin-top:16px;">Start Shopping</a>
        </div>
      </div>

      <aside class="order-summary" id="order-summary">
        <h3>Order Summary</h3>
        <div id="coupon-area"></div>
        <div class="summary-row"><span>Subtotal</span><span id="summary-subtotal">₹0</span></div>
        <div class="summary-row" id="summary-discount-row" style="display:none;"><span>Coupon Discount</span><span id="summary-discount">₹0</span></div>
        <div class="summary-row"><span>Shipping</span><span id="summary-shipping">₹0</span></div>
        <div class="summary-row"><span>GST (included)</span><span id="summary-tax">₹0</span></div>
        <div class="summary-row total"><span>Total</span><span id="summary-total">₹0</span></div>
        <p id="free-shipping-notice" style="font-size:var(--fs-xs);color:var(--color-accent-dark);margin-bottom:16px;display:none;"></p>
        <a href="checkout.html" class="btn btn-primary btn-block">Proceed to Checkout</a>
        <a href="shop.html" class="btn btn-ghost btn-block" style="margin-top:8px;">Continue Shopping</a>
      </aside>
    </div>
  </main>

  <div data-include="footer"></div>

  <script src="js/includes.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
